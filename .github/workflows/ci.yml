name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Valores fictícios: o `prisma.config.ts` e o schema do @t3-oss/env exigem
    # essas variáveis, mas nenhum passo do CI conecta ao banco.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      NEXTAUTH_SECRET: ci-secret-with-at-least-32-characters
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ci-placeholder-maps-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm test